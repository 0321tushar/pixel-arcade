<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#12162a"/>
      <stop offset="100%" stop-color="#06070c"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ff5252"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Icon Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#00d2d3" stroke-width="2.5" filter="url(#neonGlow)"/>

  <!-- Subtle Cyber Grid Accent -->
  <path d="M2 32 L62 32 M32 2 L32 62" stroke="#1c233c" stroke-width="1" stroke-dasharray="2,3"/>

  <!-- Modern Gamepad Silhouette -->
  <path d="M19 23 C14 23 11 27 13 37 L15 45 C16 48.5 20.5 49.5 23.5 46.5 L28 42 L36 42 L40.5 46.5 C43.5 49.5 48 48.5 49 45 L51 37 C53 27 50 23 45 23 C39 23 37 26 32 26 C27 26 25 23 19 23 Z" 
        fill="#141829" 
        stroke="url(#cyanGrad)" 
        stroke-width="2.2" 
        filter="url(#neonGlow)"/>

  <!-- Left D-Pad (Neon Cyan) -->
  <path d="M22 29.5 L22 36.5 M18.5 33 L25.5 33" stroke="#00f2fe" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Right Action Buttons (Neon Pink & Yellow) -->
  <circle cx="41" cy="30.5" r="2" fill="url(#pinkGrad)"/>
  <circle cx="45" cy="34.5" r="2" fill="#feca57"/>
  <circle cx="37" cy="34.5" r="2" fill="#00d2d3"/>
  <circle cx="41" cy="38.5" r="2" fill="#2ed573"/>

  <!-- Center Logo Emblem / Power Button -->
  <circle cx="32" cy="34" r="2" fill="#00f2fe" filter="url(#neonGlow)"/>
  <polygon points="32,27 30,29.5 34,29.5" fill="#feca57"/>
</svg>
